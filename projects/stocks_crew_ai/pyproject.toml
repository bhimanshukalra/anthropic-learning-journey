[project]
name = "stocks_crew_ai"
version = "0.1.0"
description = "stocks_crew_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.34,<2.0.0",
    "yfinance>=1.7.0",
]

[project.scripts]
stocks_crew_ai = "stocks_crew_ai.main:run"
run_crew = "stocks_crew_ai.main:run"
train = "stocks_crew_ai.main:train"
replay = "stocks_crew_ai.main:replay"
test = "stocks_crew_ai.main:test"
run_with_trigger = "stocks_crew_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "e4a90bee-2bfb-4d75-86a4-7912a20b5ba0"
